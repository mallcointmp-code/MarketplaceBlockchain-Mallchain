name: CI

on:
  push:
    branches: [ main, feat-local ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.1'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ${{ github.workspace }}/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install tooling
        run: |
          go install golang.org/x/tools/cmd/goimports@latest || true

      - name: Install buf
        run: |
          curl -sSL "https://github.com/bufbuild/buf/releases/latest/download/buf-Linux-x86_64" -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf

      - name: Codegen check
        run: |
          make codegen
          # fail if generated files differ from repo
          if ! git diff --exit-code; then
            echo "Generated files are out of date. Run 'make codegen' and commit changes.";
            git --no-pager diff --name-only;
            exit 1;
          fi

      - name: Run CI E2E (format, vet, test)
        run: |
          make ci-e2e
